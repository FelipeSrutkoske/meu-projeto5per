# REMOVEMOS todas as configurações globais (worker_processes, events, http)
# pois a imagem Docker do Nginx já cuida disso.
# Começamos direto com o nosso servidor.

server {
    listen 80;
    server_name localhost; # Mantemos o servidor para a porta 80

    # Pasta raiz onde montamos o build do nosso React no docker-compose.yml
    root /var/www/frontend;
    index index.html;

    # Otimização: Unimos suas 3 rotas de API em um único bloco location
    # usando uma expressão regular (regex). Isso é mais fácil de manter.
    location ~ ^/(usuarios|caminhoes|aluguel) {
        # A MÁGICA DO DOCKER: Aponta para o serviço 'backend' na porta interna dele
        proxy_pass http://backend:3000; 

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para arquivos estáticos (ótima prática que você já tinha!)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # SPA fallback para o React Router funcionar
    location / {
        try_files $uri /index.html;

        # Seus cabeçalhos de segurança (mantidos, pois são excelentes!)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=()" always;
        # CSP ajustado: removemos a referência a localhost:3000, pois 'self' já cobre o proxy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests; block-all-mixed-content;" always;

        # REMOVEMOS as diretivas 'more_clear_headers' pois elas não são padrão
    }
}

# Se você for usar HTTPS, adicione o segundo bloco de 'server' para a porta 443 aqui.